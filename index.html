
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주변 지하철역 근처 주요 시설</title>

  <!-- 카카오맵 SDK와 장소 검색 기능 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0284f30d15a21cd8c8d334026cc26d3b&libraries=services&autoload=false"></script>

  <style>
    /* 모든 요소의 크기 계산 방식을 통일 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 왼쪽과 오른쪽으로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 380px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px 20px;
      background: #fff;
      border-right: 1px solid #e5e5e5;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.4;
    }

    .description {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 음식점과 카페 탭 */
    .tab-container {
      display: flex;
      gap: 8px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 4px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #444;
      font-size: 14px;
      cursor: pointer;
    }

    /* 선택한 탭 강조 */
    .tab-button.active {
      background: #2878e8;
      border-color: #2878e8;
      color: #fff;
      font-weight: bold;
    }

    /* 키워드 검색창 */
    .search-form {
      display: flex;
      gap: 7px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
    }

    #searchButton {
      padding: 0 14px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    /* 현재 위치 버튼 */
    #locationButton {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    #status {
      margin: 0;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 가장 가까운 지하철역 정보 */
    #stationInfo {
      padding: 10px;
      border-radius: 8px;
      background: #fff9db;
      color: #665000;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .result-item {
      padding: 14px 5px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .result-item:hover,
    .result-item:focus {
      background: #f3f7ff;
      outline: none;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-category {
      margin-bottom: 5px;
      color: #777;
      font-size: 12px;
    }

    .place-address {
      color: #555;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-phone {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    .place-link {
      display: inline-block;
      margin-top: 7px;
      color: #2463eb;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f1f3f5;
    }

    /* 작은 화면에 맞게 조정 */
    @media (max-width: 700px) {
      .sidebar {
        width: 45%;
        min-width: 0;
        padding: 14px 10px;
        gap: 12px;
      }

      h1 {
        font-size: 19px;
      }

      .tab-button {
        font-size: 12px;
        padding: 10px 2px;
      }

      #searchButton {
        padding: 0 9px;
      }

      .place-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 시설 검색 및 결과 -->
    <aside class="sidebar">
      <h1>주변 지하철역 근처 주요 시설</h1>

      <p class="description">
        현재 위치에서 가장 가까운 지하철역 주변의 음식점과 카페를 찾아보세요.
      </p>

      <!-- 음식점과 카페를 선택하는 탭 2개 -->
      <div class="tab-container" role="group" aria-label="시설 종류">
        <button
          type="button"
          class="tab-button active"
          data-category="FD6"
          aria-pressed="true"
        >
          음식점
        </button>

        <button
          type="button"
          class="tab-button"
          data-category="CE7"
          aria-pressed="false"
        >
          카페
        </button>
      </div>

      <!-- 장소명이나 키워드로 검색 -->
      <form id="searchForm" class="search-form">
        <input
          id="searchInput"
          type="text"
          placeholder="장소명 또는 키워드 입력"
          aria-label="검색할 장소"
        >
        <button id="searchButton" type="submit">검색</button>
      </form>

      <!-- 현재 위치를 다시 확인하는 버튼 -->
      <button id="locationButton" type="button">
        현재 위치로 이동
      </button>

      <!-- 가장 가까운 지하철역 표시 -->
      <div id="stationInfo" hidden></div>

      <!-- 검색 상태 표시 -->
      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <!-- 검색 결과 목록 -->
      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오맵 -->
    <main id="map" aria-label="주변 시설 지도"></main>
  </div>

  <script>
    // 지도와 검색에 사용할 변수
    let map = null;
    let placesService = null;
    let currentPosition = null;
    let currentMarker = null;
    let stationMarker = null;
    let nearestStation = null;
    let placeMarkers = [];
    let infoWindow = null;
    let mapReady = false;
    let activeCategory = "FD6";
    let searchVersion = 0;

    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const locationButton = document.getElementById("locationButton");
    const statusText = document.getElementById("status");
    const stationInfo = document.getElementById("stationInfo");
    const resultList = document.getElementById("resultList");
    const tabButtons = document.querySelectorAll(".tab-button");

    // 카카오맵 SDK가 준비되면 지도 초기화
    window.addEventListener("load", function () {
      if (!window.kakao || !window.kakao.maps) {
        statusText.textContent =
          "카카오맵을 불러오지 못했습니다. API 키와 도메인 설정을 확인하세요.";
        return;
      }

      kakao.maps.load(function () {
        initializeMap();
      });
    });

    // 지도와 장소 검색 서비스 생성
    function initializeMap() {
      try {
        const initialPosition = new kakao.maps.LatLng(
          37.566826,
          126.9786567
        );

        map = new kakao.maps.Map(
          document.getElementById("map"),
          {
            center: initialPosition,
            level: 5
          }
        );

        // 장소 검색 서비스 생성
        placesService = new kakao.maps.services.Places(map);

        // 장소 이름과 주소를 보여 주는 팝업 생성
        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 10
        });

        mapReady = true;

        // 현재 위치 확인 시작
        getCurrentLocation();

      } catch (error) {
        console.error("지도 초기화 오류:", error);
        statusText.textContent =
          "지도 초기화에 실패했습니다. 설정을 확인하세요.";
      }
    }

    // 색상에 맞는 사용자 지정 마커 이미지 생성
    function createMarkerImage(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="36" height="44" viewBox="0 0 36 44">
          <path
            d="M18 42 C14 34 3 24 3 16
               A15 15 0 1 1 33 16
               C33 24 22 34 18 42Z"
            fill="${color}"
            stroke="#ffffff"
            stroke-width="2"
          />
          <circle cx="18" cy="16" r="5" fill="#ffffff"/>
        </svg>
      `;

      // SVG 이미지를 카카오맵 마커 이미지로 변환
      const imageUrl =
        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageUrl,
        new kakao.maps.Size(36, 44),
        {
          offset: new kakao.maps.Point(18, 42)
        }
      );
    }

    // 현재 위치를 가져와 빨간색 마커로 표시
    function getCurrentLocation() {
      if (!mapReady) return;

      if (!navigator.geolocation) {
        statusText.textContent =
          "이 브라우저에서는 현재 위치 기능을 사용할 수 없습니다.";
        return;
      }

      statusText.textContent = "현재 위치를 확인하고 있습니다.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 이전 위치 검색 결과가 늦게 도착하지 않도록 요청 번호 갱신
          searchVersion++;

          // 현재 위치 좌표 저장
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);
          map.setLevel(5);

          // 기존 현재 위치 마커 제거
          if (currentMarker) {
            currentMarker.setMap(null);
          }

          // 현재 위치를 빨간색 마커로 표시
          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            image: createMarkerImage("#e53935"),
            title: "내 현재 위치",
            zIndex: 5
          });

          // 이전 역과 시설 결과 제거
          clearResults();
          clearStation();

          // 현재 위치에서 가장 가까운 지하철역 검색
          findNearestStation();
        },

        function (error) {
          if (error.code === 1) {
            statusText.textContent =
              "위치 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.";
          } else if (error.code === 2) {
            statusText.textContent =
              "현재 위치를 확인할 수 없습니다.";
          } else if (error.code === 3) {
            statusText.textContent =
              "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.";
          } else {
            statusText.textContent =
              "위치 정보를 가져오지 못했습니다.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 두 좌표 사이의 거리를 미터 단위로 계산
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const earthRadius = 6371000;
      const toRadians = function (degrees) {
        return degrees * Math.PI / 180;
      };

      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) *
        Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      return earthRadius * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
    }

    // 현재 위치 주변에서 가장 가까운 지하철역 찾기
    function findNearestStation() {
      if (!currentPosition) return;

      const requestVersion = ++searchVersion;

      statusText.textContent = "가장 가까운 지하철역을 찾고 있습니다.";
      stationInfo.hidden = true;

      // 현재 위치를 기준으로 지하철역 키워드 검색
      placesService.keywordSearch(
        "지하철역",
        function (data, status) {
          // 새 검색이 시작되었다면 이전 응답 무시
          if (requestVersion !== searchVersion) return;

          if (
            status !== kakao.maps.services.Status.OK ||
            !data ||
            data.length === 0
          ) {
            statusText.textContent =
              "주변 지하철역을 찾지 못했습니다. 다른 지역에서 다시 시도해 주세요.";
            return;
          }

          // 검색 결과 중 현재 위치와의 직선거리가 가장 짧은 역 선택
          let closestPlace = null;
          let shortestDistance = Infinity;

          data.forEach(function (place) {
            const distance = calculateDistance(
              currentPosition.getLat(),
              currentPosition.getLng(),
              Number(place.y),
              Number(place.x)
            );

            if (distance < shortestDistance) {
              shortestDistance = distance;
              closestPlace = place;
            }
          });

          if (!closestPlace) {
            statusText.textContent = "가까운 지하철역을 찾지 못했습니다.";
            return;
          }

          nearestStation = closestPlace;

          const stationPosition = new kakao.maps.LatLng(
            Number(closestPlace.y),
            Number(closestPlace.x)
          );

          // 가장 가까운 지하철역을 노란색 마커로 표시
          stationMarker = new kakao.maps.Marker({
            map: map,
            position: stationPosition,
            image: createMarkerImage("#f4c20d"),
            title: closestPlace.place_name,
            zIndex: 4
          });

          // 역 마커를 누르면 역 이름과 주소 표시
          kakao.maps.event.addListener(stationMarker, "click", function () {
            showPlaceOnMap(closestPlace, stationMarker);
          });

          // 지하철역 이름과 거리 표시
          stationInfo.textContent =
            "가장 가까운 지하철역: " +
            closestPlace.place_name +
            " (직선거리 약 " +
            formatDistance(shortestDistance) +
            ")";

          stationInfo.hidden = false;

          // 선택한 역 주변의 음식점 또는 카페 검색
          searchNearbyPlaces(activeCategory, stationPosition);
        },
        {
          location: currentPosition,
          radius: 20000,
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 거리를 읽기 쉬운 단위로 표시
    function formatDistance(distance) {
      if (distance < 1000) {
        return Math.round(distance) + "m";
      }

      return (distance / 1000).toFixed(1) + "km";
    }

    // 탭 버튼을 눌렀을 때 실행
    tabButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        activeCategory = button.dataset.category;

        // 선택한 탭의 디자인 변경
        tabButtons.forEach(function (tab) {
          const isActive = tab === button;

          tab.classList.toggle("active", isActive);
          tab.setAttribute("aria-pressed", String(isActive));
        });

        // 기존 시설 마커와 목록 제거
        clearResults();

        // 이전 검색 요청 무효화
        searchVersion++;

        if (!mapReady || !currentPosition) {
          statusText.textContent =
            "현재 위치를 확인하고 있습니다. 잠시 기다려 주세요.";
          return;
        }

        if (!nearestStation) {
          findNearestStation();
          return;
        }

        const stationPosition = new kakao.maps.LatLng(
          Number(nearestStation.y),
          Number(nearestStation.x)
        );

        // 선택한 탭의 시설을 가장 가까운 역 주변에서 검색
        searchNearbyPlaces(activeCategory, stationPosition);
      });
    });

    // 지하철역 주변에서 음식점 또는 카페 검색
    function searchNearbyPlaces(categoryCode, searchPosition) {
      if (!mapReady || !searchPosition) return;

      clearResults();

      const requestVersion = ++searchVersion;

      const categoryName = categoryCode === "FD6" ? "음식점" : "카페";

      statusText.textContent =
        "가까운 지하철역 주변 " + categoryName + "을(를) 검색하고 있습니다.";

      placesService.categorySearch(
        categoryCode,
        function (data, status) {
          // 이전 검색 결과가 뒤늦게 도착하면 무시
          if (
            requestVersion !== searchVersion ||
            categoryCode !== activeCategory
          ) {
            return;
          }

          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);

            statusText.textContent =
              "지하철역 주변 " + categoryName + " " +
              data.length + "개를 찾았습니다.";

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            statusText.textContent =
              "지하철역 주변에 검색 결과가 없습니다.";

          } else {
            statusText.textContent =
              "검색 중 오류가 발생했습니다. 다시 시도해 주세요.";
          }
        },
        {
          // 가장 가까운 지하철역을 검색 중심으로 설정
          location: searchPosition,

          // 역 주변 1.5km 이내 검색
          radius: 1500,

          // 가까운 장소부터 정렬
          sort: kakao.maps.services.SortBy.DISTANCE,

          // 최대 15개 결과
          size: 15
        }
      );
    }

    // 검색창에 입력한 키워드로 장소 검색
    function searchPlaces(keyword) {
      if (!mapReady || !placesService) {
        statusText.textContent = "지도가 아직 준비되지 않았습니다.";
        return;
      }

      const searchKeyword = keyword.trim();

      if (!searchKeyword) {
        statusText.textContent = "검색어를 입력해 주세요.";
        searchInput.focus();
        return;
      }

      // 기존 시설 결과 삭제
      clearResults();

      const requestVersion = ++searchVersion;

      statusText.textContent = "장소를 검색하고 있습니다.";
      searchButton.disabled = true;

      // 가장 가까운 지하철역을 검색 중심으로 사용
      const searchOptions = nearestStation
        ? {
            location: new kakao.maps.LatLng(
              Number(nearestStation.y),
              Number(nearestStation.x)
            ),
            sort: kakao.maps.services.SortBy.DISTANCE
          }
        : {
            location: currentPosition,
            sort: kakao.maps.services.SortBy.DISTANCE
          };

      placesService.keywordSearch(
        searchKeyword,
        function (data, status) {
          searchButton.disabled = false;

          // 더 최근 검색 요청이 있으면 이전 응답 무시
          if (requestVersion !== searchVersion) return;

          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);

            statusText.textContent =
              "검색 결과 " + data.length + "개를 찾았습니다.";

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            statusText.textContent = "검색 결과가 없습니다.";

          } else {
            statusText.textContent = "검색 중 오류가 발생했습니다.";
          }
        },
        searchOptions
      );
    }

    // 검색 결과를 파란색 마커와 왼쪽 목록에 표시
    function displayPlaces(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        bounds.extend(position);

        // 음식점이나 카페를 파란색 마커로 표시
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          image: createMarkerImage("#2878e8"),
          title: place.place_name,
          zIndex: 2
        });

        placeMarkers.push(marker);

        // 검색 결과 항목 생성
        const item = document.createElement("article");
        item.className = "result-item";
        item.tabIndex = 0;

        // 장소 이름
        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = place.place_name;

        // 장소 분류
        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent =
          place.category_name || "분류 정보 없음";

        // 장소 주소
        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        item.append(name, category, address);

        // 전화번호가 제공되면 표시
        if (place.phone) {
          const phone = document.createElement("div");
          phone.className = "place-phone";
          phone.textContent = place.phone;
          item.appendChild(phone);
        }

        // 카카오맵 상세 페이지 링크
        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";

          // 링크 클릭이 장소 선택으로 이어지지 않도록 처리
          link.addEventListener("click", function (event) {
            event.stopPropagation();
          });

          item.appendChild(link);
        }

        // 장소를 선택하면 지도에 이름과 주소 표시
        function selectPlace() {
          showPlaceOnMap(place, marker);
        }

        kakao.maps.event.addListener(marker, "click", selectPlace);
        item.addEventListener("click", selectPlace);

        // 키보드로도 장소 선택 가능
        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPlace();
          }
        });

        resultList.appendChild(item);
      });

      // 검색 결과가 지도 안에 보이도록 조정
      if (places.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(
            Number(places[0].y),
            Number(places[0].x)
          )
        );
        map.setLevel(4);

      } else if (places.length > 1) {
        // 지하철역과 검색 결과가 함께 보이도록 지도 범위 설정
        if (nearestStation) {
          bounds.extend(
            new kakao.maps.LatLng(
              Number(nearestStation.y),
              Number(nearestStation.x)
            )
          );
        }

        map.setBounds(bounds);
      }
    }

    // 선택한 장소의 이름과 주소를 팝업으로 표시
    function showPlaceOnMap(place, marker) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      map.panTo(position);

      // 팝업 내용을 안전하게 생성
      const content = document.createElement("div");
      content.style.cssText =
        "padding:10px;max-width:240px;font-size:13px;line-height:1.6;";

      const name = document.createElement("strong");
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      content.append(name, address);

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // 기존 시설 마커와 목록 제거
    function clearResults() {
      placeMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      placeMarkers = [];

      // 왼쪽 결과 목록 삭제
      resultList.replaceChildren();

      // 열려 있는 장소 팝업 닫기
      if (infoWindow) {
        infoWindow.close();
      }

      // 현재 위치와 지하철역 마커는 유지
    }

    // 기존 지하철역 마커 제거
    function clearStation() {
      if (stationMarker) {
        stationMarker.setMap(null);
        stationMarker = null;
      }

      nearestStation = null;
      stationInfo.hidden = true;
      stationInfo.textContent = "";
    }

    // 검색창 제출 시 키워드 검색 실행
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // 현재 위치 버튼을 누르면 위치를 다시 확인
    locationButton.addEventListener("click", function () {
      getCurrentLocation();
    });
  </script>
</body>
</html>
